# 《劳动·制度·他者》—— 青落同学 × 亚里士飞德 视频文集
#
# 构建：
#   mdbook build              生成静态站点到 book/
#   node ../../tools/build_search_js.mjs .  重建中文搜索索引
#   mdbook serve --open       本地预览
#
# 内容源在 src/，全部 Markdown；不要手工编辑 book/ 下的产物。

[book]
title = "劳动 · 制度 · 他者"
description = "青落同学与亚里士飞德两位 UP 主 113 个视频的整理本 —— 历史唯物主义视野下的劳动、制度与比较政治"
language = "zh-CN"
src = "src"
authors = ["青落同学", "亚里士飞德ArisFatal"]

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
site-url = "/tutorials/bili-politics/"
no-section-label = true
additional-css = [
  "theme/css/base.css",
  "theme/css/atlas.css",
  "theme/css/framework.css",
  "theme/css/katex.css",
  "theme/css/bili.css",
  "theme/css/rhine.css",
  "theme/css/prefs.css",
]
additional-js = [
  "theme/js/prefs-config.js",
  "theme/js/page-extras.js",
  "theme/js/atlas.js",
  "theme/js/search-cjk.js",
  "theme/js/framework-core.js",
  "theme/js/framework-nav.js",
  "theme/js/framework-media.js",
  "theme/js/framework-text.js",
  "theme/js/prefs.js",
  "theme/js/rhine.js",
]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = false
boost-hierarchy = 4
boost-paragraph = 1
expand = true
heading-split-level = 3

# 语义盒子 + 交叉引用（与教程库其余各书同一实现）
[preprocessor.mathbook]
command = "python3 tools/mathbook.py"

[preprocessor.katex]
command = "python3 ../tools/katex_wrapper.py"
no-css = true
output = "htmlAndMathml"
after = ["mathbook"]
