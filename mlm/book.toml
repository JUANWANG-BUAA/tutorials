# 《马克思主义原理》—— 理论、历史与实践的统编教材
#
# 构建：
#   mdbook build            生成静态站点到 book/
#   node ../tools/build_search_js.mjs .   重建中文搜索索引
#   mdbook serve --open     本地预览
#
# 内容源在 src/，全部 Markdown；不要手工编辑 book/ 下的产物。

[book]
title = "马克思主义原理"
description = "从唯物史观到政治经济学批判，从第一国际到中国革命与文化大革命：一部以原始文献为依据的统编教材"
language = "zh-CN"
src = "src"
authors = ["教程库"]

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
site-url = "/tutorials/mlm/"
no-section-label = true
git-repository-url = "https://github.com/JUANWANG-BUAA/tutorials"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/JUANWANG-BUAA/tutorials/edit/main/mlm/{path}"
additional-css = [
  "theme/css/base.css",
  "theme/css/atlas.css",
  "theme/css/framework.css",
  "theme/css/katex.css",
  "theme/css/mlm.css",
  "theme/css/rhine.css",
  "theme/css/prefs.css",
]
additional-js = [
  "theme/js/prefs-config.js",
  "theme/js/page-extras.js",
  "theme/js/mlm.js",
  "theme/js/atlas.js",
  "theme/js/search-cjk.js",
  "theme/js/framework-core.js",
  "theme/js/framework-nav.js",
  "theme/js/framework-media.js",
  "theme/js/framework-text.js",
  "theme/js/prefs.js",
  "theme/js/rhine.js",
]

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = false
boost-hierarchy = 4
boost-paragraph = 1
expand = true
heading-split-level = 3

# 语义盒子 + 交叉引用
[preprocessor.mathbook]
command = "python3 tools/mathbook.py"

# 公式：构建期渲染
[preprocessor.katex]
command = "python3 ../tools/katex_wrapper.py"
no-css = true
output = "htmlAndMathml"
after = ["mathbook"]
