<path d="M229 259 C226 292, 206 315, 170 320" fill="none" stroke="#9aa6ff" stroke-opacity=".7" stroke-width="1.1" marker-end="url(#as-cover-arrow)"/>
<path d="M132 320 C96 314, 74 292, 71 259" fill="none" stroke="#9aa6ff" stroke-opacity=".7" stroke-width="1.1" marker-end="url(#as-cover-arrow)"/>
