<svg class="cover-svg" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="as-cover-title as-cover-desc">
<title id="as-cover-title">《Agent 系统工程》书封</title>
<desc id="as-cover-desc">深靛蓝封面，中央是一个由四个节点构成的循环，环内是状态与预算，下方是工具、沙箱、评估三条横线。</desc>
<defs>
  <linearGradient id="as-cover-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1c2350"/>
    <stop offset=".55" stop-color="#2b367e"/>
    <stop offset="1" stop-color="#111634"/>
  </linearGradient>
  <pattern id="as-cover-grid" width="18" height="18" patternUnits="userSpaceOnUse">
    <path d="M18 0H0V18" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
  </pattern>
  <marker id="as-cover-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0 0 10 5 0 10Z" fill="#9aa6ff"/>
  </marker>
</defs>
<rect width="300" height="420" fill="url(#as-cover-bg)"/>
<rect width="300" height="420" fill="url(#as-cover-grid)"/>
<rect x="0" y="0" width="9" height="420" fill="#0c1028"/>
<rect x="9" y="0" width="2" height="420" fill="#9aa6ff" opacity=".55"/>
<text x="34" y="58" fill="#c9d0ff" font-size="9.5" font-family="'SFMono-Regular',Consolas,monospace" letter-spacing="2.6">SYSTEMS ENGINEERING</text>
<text x="34" y="96" fill="#ffffff" font-size="27" font-weight="700" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif">Agent</text>
