<text x="34" y="154" fill="#b9c1ff" font-size="11" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC',sans-serif">循环 · 协议 · 沙箱 · 评估</text>
<circle cx="150" cy="245" r="70" fill="none" stroke="#9aa6ff" stroke-opacity=".28" stroke-dasharray="3 5"/>
