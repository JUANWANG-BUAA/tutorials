<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" role="img" aria-labelledby="alg-cover-title alg-cover-desc">
  <title id="alg-cover-title">算法、评估与因果 · 从渐进分析到因果决策</title>
  <desc id="alg-cover-desc">封面以计算复杂度曲线、决策树与因果推断图展示从算法分析到实证决策的完整路径。</desc>
  <defs>
    <linearGradient id="alg-cover-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1522"/>
      <stop offset="1" stop-color="#182c44"/>
    </linearGradient>
    <linearGradient id="alg-cover-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="alg-cover-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="420" height="560" rx="8" fill="url(#alg-cover-bg)"/>
  <rect width="420" height="560" rx="8" fill="url(#alg-cover-grid)"/>
  <path d="M34 34h352v492H34z" fill="none" stroke="#f59e0b" stroke-opacity="0.45"/>
  <text x="58" y="78" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" letter-spacing="3">ALGORITHMS / EVALUATION / CAUSALITY</text>
  <text x="58" y="142" fill="#f8fafc" font-family="Georgia, serif" font-size="34">算法、评估</text>
  <text x="58" y="184" fill="#f8fafc" font-family="Georgia, serif" font-size="34">与因果推断</text>
  <text x="58" y="218" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="12">FROM ASYMPTOTICS TO CAUSAL DECISIONS</text>

  <!-- 几何架构：复杂度曲线与因果网络 -->
  <g stroke="url(#alg-cover-line)" stroke-width="2" fill="none" opacity="0.85">
    <!-- 坐标轴 -->
    <path d="M78 440h264"/>
    <path d="M78 440v-160"/>
    <!-- O(n log n) 复杂度曲线 -->
    <path d="M78 440 Q 180 430, 240 370 T 342 290" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- O(n) 线性基准 -->
    <path d="M78 440 L 342 360" stroke="#f59e0b" stroke-dasharray="4 4" stroke-width="1.5"/>
  </g>

  <!-- 因果推断 DAG 节点与决策流 -->
  <g fill="#0b1522" stroke="#38bdf8" stroke-width="2">
    <circle cx="120" cy="300" r="16"/>
    <circle cx="210" cy="300" r="16"/>
    <circle cx="300" cy="300" r="16"/>
    <circle cx="210" cy="240" r="14" stroke="#f59e0b"/>
  </g>
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M136 300h58"/>
    <path d="M226 300h58"/>
    <path d="M200 252l-64 36" stroke="#f59e0b" stroke-dasharray="3 3"/>
    <path d="M220 252l64 36" stroke="#f59e0b" stroke-dasharray="3 3"/>
  </g>

  <g fill="#f8fafc" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">
    <text x="120" y="304">Z</text>
    <text x="210" y="304">T</text>
    <text x="300" y="304">Y</text>
    <text x="210" y="244" fill="#f59e0b">U</text>
  </g>

  <!-- 底部徽标 -->
  <text x="58" y="506" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">14 CHAPTERS / 2 PROJECTS / SCIENTIFIC REPRODUCIBILITY</text>
  <text x="58" y="524" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="10">BUAA · GRADUATE ALGORITHMIC LIBRARY</text>
</svg>
