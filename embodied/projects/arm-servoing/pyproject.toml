[project]
name = "arm-servoing"
version = "0.1.0"
description = "Robotic Arm Visual Servoing (PBVS & IBVS) with Interaction Matrix and Closed-loop Control"
authors = [{ name = "Embodied Perception Team" }]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
