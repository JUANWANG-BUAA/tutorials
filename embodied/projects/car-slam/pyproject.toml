[project]
name = "car-slam"
version = "0.1.0"
description = "2D Mobile Robot SLAM with Scan Matching, Submaps, Occupancy Grid & Pose Graph Loop Closure"
authors = [{ name = "Embodied Perception Team" }]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
