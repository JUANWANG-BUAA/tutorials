name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install compiler test tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Install mdbook
        run: |
          curl -sfL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar xz -C /usr/local/bin
          mdbook --version

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install mdbook-katex
        run: cargo install --locked mdbook-katex --version 0.10.0

      - name: Install python deps
        run: pip3 install markdown-it-py pillow -r tools/formal/requirements.txt

      - name: Install browser
        run: npx --yes --package @playwright/cli@0.1.22 playwright-cli install-browser chrome --with-deps

      - name: Check and build all books
        run: bash check.sh

      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            .playwright-cli/
            output/playwright/
            output/formal/
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
