name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          curl -sfL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar xz -C /usr/local/bin
          mdbook --version

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install mdbook-katex
        run: cargo install --locked mdbook-katex --version 0.10.0

      - name: Install python deps
        run: pip3 install markdown-it-py pillow

      - name: Build all books
        run: |
          set -e
          mkdir -p _site
          for book in robot numerical matrix deeplearning; do
            mdbook build "$book"
            # mdBook 自带分词器不处理中文，「数域」「过渡矩阵」这类词进不了索引，
            # 中文全文搜索会形同虚设。构建后用字符 n-gram 重建索引（这一步曾在
            # CI 里缺失，导致线上中文搜索一直搜不到——见各书 README）。
            node tools/build_search_js.mjs "$book"
            # 术语悬挂提示的数据：从各书已有的索引页（速查背记卡 / 术语索引）
            # 抽成 book/glossary.json，前端按需取用（缺失时自动不增强）。
            python3 tools/build_glossary.py "$book"
            mv "$book/book" "_site/$book"
          done
          cp site-index.html _site/index.html
          python3 tools/optimize_site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
