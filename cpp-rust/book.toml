# 《C++/Rust 性能工程》定制配置
#
#   cd cpp-rust && mdbook build .
#   cd cpp-rust && python3 tools/verify_all.py

[book]
title = "Rust 底层性能工程"
description = "Rust主线的16章性能工程：rustc/HIR/MIR/LLVM、对象与所有权、原子和内存回收、Future与执行器、多进程与IPC、SIMD与I/O、profiling、Cargo与两个可执行项目；保留cpp-rust路径。"
language = "zh-CN"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
additional-css = [
  "theme/css/base.css",
  "theme/css/cpp-rust.css",
  "theme/css/katex.css",
  "theme/css/framework.css",
  "theme/css/atlas.css",
  "theme/css/rhine.css",
  "theme/css/prefs.css",
]
additional-js = [
  "theme/js/prefs-config.js",
  "theme/js/page-extras.js",
  "theme/js/search-cjk.js",
  "theme/js/framework-core.js",
  "theme/js/framework-nav.js",
  "theme/js/framework-media.js",
  "theme/js/framework-text.js",
  "theme/js/prefs.js",
  "theme/js/rhine.js",
  "theme/js/atlas.js",
]
git-repository-url = "https://github.com/JUANWANG-BUAA/tutorials"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/JUANWANG-BUAA/tutorials/edit/main/cpp-rust/{path}"
no-section-label = true
site-url = "/tutorials/cpp-rust/"

[output.html.search]
enable = true
limit-results = 40
teaser-word-count = 36
use-boolean-and = false
boost-hierarchy = 4
boost-paragraph = 1
expand = true
heading-split-level = 3

[preprocessor.mathbook]
command = "python3 tools/mathbook.py"
