# 《C++/Rust 性能工程》定制配置
#
#   cd cpp-rust && mdbook build .
#   cd cpp-rust && python3 tools/verify_all.py

[book]
title = "Rust 底层性能工程"
description = "面向高年级本科生与研究生的 Rust 性能工程教材：性能指标与测量、rustc/HIR/MIR/LLVM、对象与所有权、原子与内存回收、Future与执行器、多进程与IPC、SIMD与I/O、profiling、Cargo与两个可执行项目；保留cpp-rust路径。"
language = "zh-CN"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
additional-css = [
  "theme/css/base.css",
  "theme/css/cpp-rust.css",
  "theme/css/katex.css",
  "theme/css/framework.css",
  "theme/css/atlas.css",
  "theme/css/rhine.css",
  "theme/css/prefs.css",
]
additional-js = [
  "theme/js/prefs-config.js",
  "theme/js/page-extras.js",
  "theme/js/cpp-rust.js",
  "theme/js/search-cjk.js",
  "theme/js/framework-core.js",
  "theme/js/framework-nav.js",
  "theme/js/framework-media.js",
  "theme/js/framework-text.js",
  "theme/js/prefs.js",
  "theme/js/rhine.js",
  "theme/js/atlas.js",
]
git-repository-url = "https://github.com/JUANWANG-BUAA/tutorials"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/JUANWANG-BUAA/tutorials/edit/main/cpp-rust/{path}"
no-section-label = true
site-url = "/tutorials/cpp-rust/"

[output.html.search]
enable = true
limit-results = 40
teaser-word-count = 36
use-boolean-and = false
boost-hierarchy = 4
boost-paragraph = 1
expand = true
heading-split-level = 3

[preprocessor.mathbook]
command = "sh tools/run_mathbook.sh"

# 公式：构建期渲染为 HTML（不依赖运行时 JS）。
# no-css = true → 不注入 KaTeX 的 CDN 样式表；改用随仓库分发的
# theme/css/katex.css + src/fonts/katex/（离线可用，无第三方请求）。
# 走包装器：KaTeX 产物会被 pulldown 再解析一遍，字面 `~`（GFM 删除线）与
# <annotation> 里的原始 TeX（强调/链接/表格定界符）都要先中和成实体，
# 否则整页刷出 unclosed HTML tag 告警、公式结构被打散。见 tools/katex_wrapper.py。
# 共享脚本（多本一份）：仓库根的 tools/katex_wrapper.py ✓ 路径相对本书根
[preprocessor.katex]
command = "python3 ../tools/katex_wrapper.py"
no-css = true
output = "htmlAndMathml"
after = ["mathbook"]
