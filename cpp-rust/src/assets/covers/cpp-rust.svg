<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" role="img" aria-labelledby="cr-cover-title cr-cover-desc">
  <title id="cr-cover-title">Rust 底层性能工程 · 编译器、并发与运行时</title>
  <desc id="cr-cover-desc">封面展示从寄存器、内存布局、原子同步到异步执行器与进程隔离的底层数据通路，强调真实可测与零成本抽象。</desc>
  <defs>
    <linearGradient id="cr-cover-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14191f"/>
      <stop offset="50%" stop-color="#1d252e"/>
      <stop offset="100%" stop-color="#28323d"/>
    </linearGradient>
    <linearGradient id="cr-cover-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d96b27"/>
      <stop offset="100%" stop-color="#e28a4b"/>
    </linearGradient>
    <linearGradient id="cr-cover-line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#56b6c2"/>
      <stop offset="100%" stop-color="#d96b27"/>
    </linearGradient>
    <pattern id="cr-cover-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#56b6c2" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- 背景与网格 -->
  <rect width="420" height="560" rx="8" fill="url(#cr-cover-bg)"/>
  <rect width="420" height="560" rx="8" fill="url(#cr-cover-grid)"/>
  <!-- 边框内衬 -->
  <path d="M32 32h356v496H32z" fill="none" stroke="#d96b27" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- 头部标识 -->
  <text x="56" y="74" fill="#56b6c2" font-family="ui-monospace, monospace" font-size="11" letter-spacing="3">VOL. 11 / SYSTEMS &amp; PERFORMANCE</text>
  <!-- 主标题 -->
  <text x="56" y="136" fill="#f5f0e6" font-family="Georgia, 'Noto Serif SC', serif" font-size="34" font-weight="700">Rust 底层</text>
  <text x="56" y="178" fill="#f5f0e6" font-family="Georgia, 'Noto Serif SC', serif" font-size="34" font-weight="700">性能工程</text>
  <!-- 副标题 -->
  <text x="56" y="214" fill="#e28a4b" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.5">COMPILER, CONCURRENCY &amp; RUNTIME</text>
  <!-- 架构拓扑示意图 (从 rustc/MIR 到硬件原子、异步执行器与零拷贝) -->
  <g stroke="url(#cr-cover-line)" stroke-width="2" fill="none" opacity="0.85">
    <path d="M72 280h276"/>
    <path d="M72 344h276"/>
    <path d="M72 408h276"/>
    <path d="M110 260v168"/>
    <path d="M210 260v168"/>
    <path d="M310 260v168"/>
  </g>
  <!-- 拓扑节点 -->
  <g fill="#14191f" stroke="#56b6c2" stroke-width="2">
    <circle cx="110" cy="280" r="16"/><circle cx="210" cy="280" r="16"/><circle cx="310" cy="280" r="16"/>
    <circle cx="110" cy="344" r="16"/><circle cx="210" cy="344" r="16"/><circle cx="310" cy="344" r="16"/>
    <circle cx="110" cy="408" r="16"/><circle cx="210" cy="408" r="16"/><circle cx="310" cy="408" r="16"/>
  </g>
  <!-- 节点文字标签 -->
  <g fill="#f5f0e6" font-family="ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="middle">
    <text x="110" y="284">MIR</text><text x="210" y="284">LLVM</text><text x="310" y="284">ASM</text>
    <text x="110" y="348">Lock</text><text x="210" y="348">CAS</text><text x="310" y="348">EBR</text>
    <text x="110" y="412">Async</text><text x="210" y="412">SIMD</text><text x="310" y="412">Ring</text>
  </g>
  <!-- 底部装饰线与元信息 -->
  <path d="M56 462h308" stroke="#d96b27" stroke-opacity="0.3" stroke-width="1"/>
  <text x="56" y="492" fill="#8d99ae" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">16 CHAPTERS · 2 PROJECTS · FULL VERIFICATION</text>
  <text x="56" y="508" fill="#56b6c2" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.5">FROM ZERO-COST ABSTRACTION TO RAW SILICON</text>
</svg>
